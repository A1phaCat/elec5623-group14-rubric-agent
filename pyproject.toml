[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-marking-agent"
version = "0.2.0"
description = "ELEC5623 Group 14 Track A prototype: evidence-first rubric marking assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pypdf>=5.0",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rma = "rubric_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
