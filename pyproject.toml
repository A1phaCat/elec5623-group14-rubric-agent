[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubric-marking-agent"
version = "1.0.0"
description = "ELEC5623 Group 14 Track A prototype: evidence-first rubric marking assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pypdf>=5.0",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rma = "rubric_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests", "app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S110", "S112"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/*" = ["E402"]
